name: Swift validation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Verify full Xcode toolchain
        run: |
          xcodebuild -version
          swift --version
          test "$(xcode-select -p)" != "/Library/Developer/CommandLineTools"
      - name: Strict build and core checks
        run: ./scripts/check.sh
      - name: Run XCTest suite
        run: swift test -Xswiftc -warnings-as-errors
      - name: Build ad-hoc signed app
        run: ./scripts/build-app.sh
      - name: Verify app signature
        run: codesign --verify --deep --strict --verbose=2 dist/YTools.app
